        * {

        body {

        }
        .container {

        }

        .header {

            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 16px;
        }
        .logo h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo span {
            font-size: 14px;
            color: #8b9bb5;
            display: block;
        }

        .search-box input {
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid #2a3344;
            background: #131a24;
            color: #e8edf5;
            font-size: 15px;
            width: 300px;
            outline: none;
        }
        .search-box input:focus {
            border-color: #6366f1;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
        }
        .filter-btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid #2a3344;
            background: transparent;
            color: #b0c0d8;
            cursor: pointer;
            transition: 0.25s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-btn:hover {
            background: #1e2736;
            color: #fff;
        }
        .filter-btn.active {
            background: #6366f1;
            border-color: #6366f1;
            color: #fff;
        }
        .filter-btn .cat-icon {
            width: 24px;
            height: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .card {
            background: #131b26;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #1f2a3a;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #3f5170;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .card .badge {
            background: #2d3b52;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            color: #b0c8e8;
            align-self: flex-end;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card .badge svg {
            width: 16px;
            height: 16px;
        }
        .card h3 {
            font-size: 20px;
            margin: 10px 0 6px;
            color: #f0f4fe;
        }
        .card .desc {
            color: #8b9bb5;
            font-size: 14px;
            flex: 1;
            margin-bottom: 16px;
        }
        .card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1f2a3a;
            padding-top: 14px;
        }
        .card .meta .category-tag {
            background: #1a2538;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            color: #9ab0d0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card .meta .category-tag svg {
            width: 16px;
            height: 16px;
        }
        .get-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.25s;
        }
        .get-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #141e2b;
            max-width: 500px;
            width: 100%;
            border-radius: 28px;
            padding: 32px 28px;
            border: 1px solid #2d3b52;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            animation: modalIn 0.35s ease;
        }
        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .modal-title {
            font-size: 24px;
            font-weight: 700;
        }
        .close-modal {
            background: transparent;
            border: none;
            color: #8b9bb5;
            font-size: 28px;
            cursor: pointer;
        }
        .modal-sub {
            color: #8b9bb5;
            font-size: 15px;
            margin-bottom: 24px;
        }

        .task-item {
            background: #0e1622;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #1f2a3a;
            transition: 0.2s;
        }
        .task-item .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-item .task-name {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .task-item .task-name svg {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        .task-btn {
            background: #1f2a3a;
            border: none;
            color: #e8edf5;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-btn:hover {
            background: #2d3b52;
        }
        .task-btn.completed {
            background: #22c55e;
            color: #fff;
        }
        .task-btn .timer {
            font-weight: 400;
            background: rgba(0, 0, 0, 0.25);
            padding: 0 10px;
            border-radius: 40px;
            font-size: 13px;
            margin-left: 8px;
        }
        .task-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .unlock-btn {
            background: #2a3344;
            border: none;
            color: #6a7f9c;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: not-allowed;
            transition: 0.25s;
            width: 100%;
            margin-top: 10px;
        }
        .unlock-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            cursor: pointer;
        }
        .unlock-btn.active:hover {
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
        }

        .code-box {
            background: #0a0f18;
            border-radius: 16px;
            padding: 16px;
            font-family: monospace;
            font-size: 13px;
            color: #b0d0f0;
            word-break: break-all;
            border: 1px solid #1f2a3a;
            max-height: 120px;
            overflow-y: auto;
            display: none;
            margin-top: 14px;
        }
        .code-box.show {
            display: block;
        }

        .copy-btn {
            background: #1f2a3a;
            border: none;
            color: #e8edf5;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #2d3b52;
        }

        @media (max-width: 640px) {
            .header {

                align-items: stretch;
            }

                width: 100%;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 24px 18px;
            }
        }
    </style>
</head>

                { id: 27, name: "Hoho Hub", category: "other", desc: "Auto Farm, ESP, Aimbot, Kill Aura.", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/acxies/HohoHub/main/HohoHub.lua'))()" },
                { id: 28, name: "Vape V4", category: "other", desc: "Silent Aim, ESP, Fly, Speed, Kill Aura.", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/7GrandDadPGN/VapeV4ForRoblox/main/MainScript'))()" },
                { id: 29, name: "Owl Hub", category: "bloxfruits", desc: "Auto Farm, Auto Raid, Auto Sea.", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/Rukiri/OwlHub/master/OwlHub.lua'))()" },
                { id: 30, name: "Zen Hub", category: "other", desc: "Admin Commands, Fly, Noclip, ESP.", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/scriptblox/ZenHub/main/ZenHub.lua'))()" },
                { id: 31, name: "Hydro Hub", category: "mm2", desc: "Aimbot, ESP, Silent Aim, Kill All (MM2/Arsenal).", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/HydroScripts/HydroHub/main/Main.lua'))()" },
                { id: 32, name: "Void Hub", category: "other", desc: "Auto Farm, Auto Hatch, Auto Collect.", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/VoidScripts/VoidHub/main/VoidHub.lua'))()" },
                { id: 33, name: "Nebula Hub", category: "other", desc: "ESP, Aimbot, Fly, Speed, Kill Aura.", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/NebulaScripts/NebulaHub/main/Nebula.lua'))()" }
            ];

            const grid = document.getElementById('scriptGrid');
            const searchInput = document.getElementById('searchInput');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const modalOverlay = document.getElementById('modalOverlay');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const unlockBtn = document.getElementById('unlockBtn');
            const codeBox = document.getElementById('codeBox');
            const copyBtn = document.getElementById('copyCodeBtn');

            const taskState = {
                discord: { completed: false, timer: null },
                youtube: { completed: false, timer: null },
                tiktok: { completed: false, timer: null }
            };

            let currentScriptLink = '';
            let activeFilter = 'all';

            const categoryIcons = {
                mm2: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/><circle cx="12" cy="12" r="3"/></svg>`,
                bloxfruits: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff6348" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/><path d="M2 12h20"/><circle cx="12" cy="12" r="4"/></svg>`,
                petsim: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#feca57" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="9" r="1.5"/><circle cx="15" cy="9" r="1.5"/><path d="M5 5l2 2M19 5l-2 2"/></svg>`,
                dahood: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2ed573" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/><rect x="7" y="15" width="10" height="6" rx="1"/></svg>`,
                bladeball: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff4757" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/><path d="M2 12h20"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3"/></svg>`,
                brookhaven: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e90ff" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/><rect x="8" y="14" width="8" height="6" rx="1"/><circle cx="12" cy="8" r="2"/></svg>`,
                other: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a29bfe" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="21" x2="9" y2="9"/><circle cx="12" cy="12" r="2"/></svg>`
            };

            function renderCards(filter, query) {
                const filtered = scripts.filter(s => {
                    const matchCategory = filter === 'all' || s.category === filter;
                    const matchQuery = s.name.toLowerCase().includes(query.toLowerCase()) ||
                        s.desc.toLowerCase().includes(query.toLowerCase());
                    return matchCategory && matchQuery;
                });

                if (filtered.length === 0) {
                    grid.innerHTML =
                        `<p style="grid-column:1/-1; text-align:center; color:#5a6a82; padding:60px 0;">🔍 Sonuç bulunamadı.</p>`;
                    return;
                }

                grid.innerHTML = filtered.map(s => `
                        <div class="card">
                            <span class="badge">${categoryIcons[s.category] || ''} ${s.category.toUpperCase()}</span>
                            <h3>${s.name}</h3>
                            <div class="desc">${s.desc}</div>
                            <div class="meta">
                                <span class="category-tag">${categoryIcons[s.category] || ''} #${s.category}</span>
                                <button class="get-btn" data-link="${s.link}">📥 GET SCRIPT</button>
                            </div>
                        </div>
                    `).join('');

                document.querySelectorAll('.get-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        currentScriptLink = this.dataset.link;
                        openModal();
                    });
                });
            }

            function openModal() {
                resetTasks();
                codeBox.classList.remove('show');
                codeBox.textContent = '';
                copyBtn.style.display = 'none';
                unlockBtn.disabled = true;
                unlockBtn.classList.remove('active');
                unlockBtn.textContent = '🔒 Görevleri Tamamla';
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                ['discord', 'youtube', 'tiktok'].forEach(task => {
                    if (taskState[task].timer) {
                        clearInterval(taskState[task].timer);
                        taskState[task].timer = null;
                    }
                });
            }

            function resetTasks() {
                ['discord', 'youtube', 'tiktok'].forEach(task => {
                    taskState[task].completed = false;
                    const btn = document.querySelector(`.task-btn[data-task="${task}"]`);
                    if (btn) {
                        btn.classList.remove('completed');
                        btn.disabled = false;
                        const names = { discord: 'Katıl', youtube: 'Abone Ol', tiktok: 'Takip Et' };
                        btn.innerHTML = names[task];
                        const timerSpan = btn.querySelector('.timer');
                        if (timerSpan) timerSpan.remove();
                    }
                    const taskDiv = document.getElementById(`task${task.charAt(0).toUpperCase() + task.slice(1)}`);
                    if (taskDiv) taskDiv.style.borderColor = '#1f2a3a';
                });
                unlockBtn.disabled = true;
                unlockBtn.classList.remove('active');
                unlockBtn.textContent = '🔒 Görevleri Tamamla';
            }

            document.querySelectorAll('.task-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const task = this.dataset.task;
                    if (taskState[task].completed) return;

                    const urls = {
                        discord: 'https://discord.gg/JJmEGx9mN3',
                        youtube: 'https://www.youtube.com/@mm2_ultimatehub',
                        tiktok: 'https://www.tiktok.com/@mm2_ultimatehub'
                    };
                    window.open(urls[task], '_blank');

                    const btnEl = this;
                    btnEl.disabled = true;
                    let count = 40;
                    const timerSpan = document.createElement('span');
                    timerSpan.className = 'timer';
                    timerSpan.textContent = `⏳ ${count}s`;
                    btnEl.appendChild(timerSpan);

                    const timerId = setInterval(() => {
                        count--;
                        timerSpan.textContent = `⏳ ${count}s`;
                        if (count <= 0) {
                            clearInterval(timerId);
                            taskState[task].completed = true;
                            btnEl.classList.add('completed');
                            btnEl.disabled = false;
                            const doneNames = { discord: '✅ Katıldın!', youtube: '✅ Abone Oldun!',
                                tiktok: '✅ Takip Ettin!' };
                            btnEl.innerHTML = doneNames[task];
                            const taskDiv = document.getElementById(`task${task.charAt(0).toUpperCase() + task.slice(1)}`);
                            if (taskDiv) taskDiv.style.borderColor = '#22c55e';
                            checkUnlock();
                        }
                    }, 1000);

                    taskState[task].timer = timerId;
                });
            });

            function checkUnlock() {
                if (taskState.discord.completed && taskState.youtube.completed && taskState.tiktok.completed) {
                    unlockBtn.disabled = false;
                    unlockBtn.classList.add('active');
                    unlockBtn.textContent = '🔓 Kodu Göster';
                }
            }

            unlockBtn.addEventListener('click', function() {
                if (this.disabled) return;
                codeBox.textContent = currentScriptLink;
                codeBox.classList.add('show');
                copyBtn.style.display = 'inline-block';
                this.textContent = '✅ Kod Hazır';
                this.disabled = true;
            });

            copyBtn.addEventListener('click', function() {
                const code = codeBox.textContent;
                if (!code) return;
                navigator.clipboard.writeText(code).then(() => {
                    this.textContent = '✅ Kopyalandı!';
                    setTimeout(() => { this.textContent = '📋 Kodu Kopyala'; }, 2000);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = code;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    this.textContent = '✅ Kopyalandı!';
                    setTimeout(() => { this.textContent = '📋 Kodu Kopyala'; }, 2000);
                });
            });

            closeModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeFilter = this.dataset.category;
                    renderCards(activeFilter, searchInput.value);
                });
            });

            searchInput.addEventListener('input', function() {
                renderCards(activeFilter, this.value);
            });

            renderCards('all', '');
        })();
    </script>
</body>
</html>
