<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ScriptHub · 120+ Script</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">
    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <div>
                <h1>🔥 ScriptHub</h1>
                <span>120+ Script & 🎮 Oyunlar</span>
            </div>
        </div>
        <div style="display:flex;gap:0.8rem;flex-wrap:wrap;align-items:center">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Script veya oyun ara..." autocomplete="off">
            </div>
            <div class="sort-group">
                <button class="sort-btn active" data-sort="default">Varsayılan</button>
                <button class="sort-btn" data-sort="az">A-Z</button>
                <button class="sort-btn" data-sort="za">Z-A</button>
                <button class="sort-btn" data-sort="popular">⭐ Popüler</button>
                <button class="sort-btn" data-sort="newest">🕐 Yeni</button>
            </div>
            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
                <span style="color:var(--text-muted);font-size:0.8rem">📊 <strong id="totalCount">0</strong></span>
                <button class="auth-btn" id="loginBtn">🔑 Giriş Yap</button>
                <button class="add-btn" id="addScriptBtn">➕ Script Ekle</button>
                <button class="add-game-btn" id="addGameBtn">🎮 Oyun Ekle</button>
            </div>
        </div>
    </header>

    <!-- CATEGORIES -->
    <div class="categories" id="categoryFilter">
        <button class="cat-btn active" data-cat="all">📋 Hepsi</button>
        <button class="cat-btn" data-cat="mm2">🔪 MM2</button>
        <button class="cat-btn" data-cat="bloxfruits">🍉 Blox Fruits</button>
        <button class="cat-btn" data-cat="petsim">🐾 Pet Sim 99</button>
        <button class="cat-btn" data-cat="dahood">🔫 Da Hood</button>
        <button class="cat-btn" data-cat="bladeball">⚡ Blade Ball</button>
        <button class="cat-btn" data-cat="brookhaven">🏡 Brookhaven</button>
        <button class="cat-btn" data-cat="other">🎮 Diğer</button>
        <button class="cat-btn" data-cat="favorites">❤️ Favorilerim</button>
    </div>

    <!-- GRID -->
    <div id="scriptGrid" class="script-grid">
        <div class="loading">
            <div class="loading-spinner"></div>
            <br>⏳ Yükleniyor...
        </div>
    </div>
    <div class="pagination-controls" id="paginationControls"></div>

    <!-- FOOTER -->
    <footer class="footer">
        <span>© 2026 ScriptHub · 120+ Script</span>
        <div class="social-links">
            <a href="#">💬 Discord</a>
            <a href="#">▶️ YouTube</a>
            <a href="#">🎵 TikTok</a>
        </div>
    </footer>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2>🔐 Giriş Yap</h2>
            <button class="modal-close" id="closeAuthModal">✕</button>
        </div>
        <div class="form-group">
            <label>E-posta</label>
            <input type="email" id="loginEmail" placeholder="ornek@email.com">
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <div id="loginError" style="color:#ff6b6b;display:none;margin-bottom:0.5rem"></div>
        <button class="submit-btn" id="loginSubmitBtn">🚀 Giriş Yap</button>
    </div>
</div>

<!-- ADD SCRIPT MODAL -->
<div class="modal-overlay" id="addModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2>➕ Yeni Script Ekle</h2>
            <button class="modal-close" id="closeAddModal">✕</button>
        </div>
        <form id="addScriptForm">
            <div class="form-group">
                <label>Script Adı *</label>
                <input type="text" id="scriptName" placeholder="Örn: God Mode Pro" required>
            </div>
            <div class="form-group">
                <label>Kategori *</label>
                <select id="scriptCategory">
                    <option value="mm2">🗡️ MM2</option>
                    <option value="bloxfruits">🍉 Blox Fruits</option>
                    <option value="petsim">🐾 Pet Sim 99</option>
                    <option value="dahood">🔫 Da Hood</option>
                    <option value="bladeball">⚡ Blade Ball</option>
                    <option value="brookhaven">🏡 Brookhaven</option>
                    <option value="other">🎮 Diğer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Açıklama *</label>
                <input type="text" id="scriptDesc" placeholder="Script ne işe yarıyor?" required>
            </div>
            <div class="form-group">
                <label>Özellikler (virgülle ayır)</label>
                <input type="text" id="scriptFeatures" placeholder="Aimbot, ESP, Auto Farm">
            </div>
            <div class="form-group">
                <label>Script Kodu *</label>
                <textarea id="scriptCodeInput" placeholder="loadstring(game:HttpGet('https://...'))()" required></textarea>
            </div>
            <button type="submit" class="submit-btn">🚀 Herkese Açık Ekle!</button>
        </form>
    </div>
</div>

<!-- ADD GAME MODAL -->
<div class="modal-overlay" id="addGameModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2>🎮 Oyun Ekle</h2>
            <button class="modal-close" id="closeAddGameModal">✕</button>
        </div>
        <form id="addGameForm">
            <div class="form-group">
                <label>Oyun Adı *</label>
                <input type="text" id="gameName" placeholder="Örn: My Game" required>
            </div>
            <div class="form-group">
                <label>Oyun Linki *</label>
                <input type="url" id="gameLink" placeholder="https://www.roblox.com/games/..." required>
            </div>
            <div class="form-group">
                <label>Oyun Resmi *</label>
                <input type="url" id="gameImage" placeholder="https://i.imgur.com/resim.png" required>
            </div>
            <button type="submit" class="submit-btn">🎮 Oyunu Ekle!</button>
        </form>
    </div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="taskModal">
    <div class="modal-card">
        <div class="modal-header">
            <h2>🔓 Script Kilidi</h2>
            <button class="modal-close" id="closeModal">✕</button>
        </div>
        <div style="color:var(--accent-light);font-size:0.85rem;margin-bottom:1rem">3 görevi tamamla, premium kodu al.</div>
        <div style="margin:0.8rem 0;color:var(--text-secondary)">📜 <strong id="taskScriptName" style="color:var(--accent-light)">—</strong></div>
        <div class="task-row">
            <button class="task-btn" data-task="discord">💬 Discord</button>
            <button class="task-btn" data-task="youtube">▶️ YouTube</button>
            <button class="task-btn" data-task="tiktok">🎵 TikTok</button>
        </div>
        <div class="task-progress">
            <span id="taskStatus">0/3</span>
            <div class="bar"><div class="fill" id="progressFill"></div></div>
        </div>
        <button class="reveal-btn" id="revealCodeBtn">🔐 Kodu Göster</button>
        <div class="code-container" id="codeContainer">
            <div class="code-area">
                <pre id="taskScriptCode">loadstring("scripthub")()</pre>
                <button class="copy-btn" id="copyCodeBtn">📋 Kopyala</button>
            </div>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span id="toastMessage"></span></div>

<!-- SCROLL TOP -->
<button class="scroll-top" id="scrollTopBtn">↑</button>

<!-- SCRIPTS -->
<script src="firebase-config.js"></script>
<script src="scripts.js"></script>
<script src="main.js"></script>

</body>
</html>
