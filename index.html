<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="52VeMEzmkVrq_n6suS8E8Bx_D4dcoQXphroDEAa1FRU">
    <title>ScriptHub | Roblox Premium Scripts</title>
    <style>
        /* =============================================
           RESET & TEMEL - MOR/MAVİ TEMA
           ============================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
            color: #f0ecff;
            background-image: url('https://i.ibb.co/tpDD2CGT/Gemini-Generated-mage-kd9s24kd9s24kd9s.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(180deg, rgba(10, 11, 30, 0.70) 0%, rgba(20, 15, 50, 0.60) 50%, rgba(10, 11, 30, 0.70) 100%);
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 70% 30%, rgba(160, 80, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 20% 70%, rgba(80, 130, 255, 0.06) 0%, transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(200, 100, 255, 0.05) 0%, transparent 30%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 0 4px;
        }

        /* =============================================
           ANİMASYONLAR
           ============================================= */
        @keyframes fadeSlideDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideLeft {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(130, 80, 255, 0.2); }
            50% { box-shadow: 0 0 35px rgba(130, 80, 255, 0.5); }
        }
        @keyframes modalZoom {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =============================================
           HEADER - LOGO ARKASI GÖRSELLİ
           ============================================= */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 14px 16px;
            background: rgba(16, 14, 45, 0.40);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 18px;
            border: 1px solid rgba(130, 80, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(130, 80, 255, 0.2);
            animation: fadeSlideDown 0.6s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/jvHH2Cbh/Gemini-Generated-mage-3nz6w3nz6w3nz6w3.png');
            background-size: cover;
            background-position: center;
            opacity: 0.45;
            z-index: 0;
            filter: blur(0px);
            transition: opacity 0.3s ease;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(10, 8, 30, 0.75) 0%, rgba(10, 8, 30, 0.35) 50%, rgba(10, 8, 30, 0.75) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .header .logo,
        .header .header-right {
            position: relative;
            z-index: 2;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #8b6cf7;
            flex-shrink: 0;
            box-shadow: 0 0 25px rgba(130, 80, 255, 0.35);
            transition: 0.3s;
            position: relative;
            z-index: 2;
        }

        .logo-img:hover {
            border-color: #a78bfa;
            box-shadow: 0 0 40px rgba(130, 80, 255, 0.6);
            transform: scale(1.05);
        }

        .logo h1 {
            font-size: 22px;
            background: linear-gradient(135deg, #ffffff, #c4b5fd, #a78bfa);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 5s ease infinite;
            letter-spacing: -0.3px;
            white-space: nowrap;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .logo span {
            font-size: 11px;
            color: #d4c8ff;
            display: block;
            margin-top: 1px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }

        .search-box {
            width: 100%;
        }

        .search-box input {
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid rgba(130, 80, 255, 0.3);
            background: rgba(10, 8, 30, 0.7);
            color: #e8edf5;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: 0.3s;
            -webkit-appearance: none;
            backdrop-filter: blur(4px);
        }

        .search-box input:focus {
            border-color: #8b6cf7;
            box-shadow: 0 0 0 3px rgba(130, 80, 255, 0.25), 0 0 20px rgba(130, 80, 255, 0.2);
            background: rgba(10, 8, 30, 0.9);
        }

        .search-box input::placeholder {
            color: #94a3b8;
            font-size: 13px;
        }

        /* =============================================
           FİLTRELER (BÜYÜTÜLDÜ)
           ============================================= */
        .filters {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 14px;
            background: rgba(16, 14, 45, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(130, 80, 255, 0.08);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            animation: fadeSlideLeft 0.5s ease forwards;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 10px 18px; /* Buton içi boşluğu büyütüldü */
            border-radius: 30px;
            border: 1px solid rgba(130, 80, 255, 0.15);
            background: rgba(10, 8, 30, 0.4);
            color: #a5b4fc;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 14px; /* Yazı boyutu 12px'den 14px'e çıkarıldı */
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px; /* İkon ve yazı arası mesafe artırıldı */
            white-space: nowrap;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        .filter-btn:hover {
            background: rgba(130, 80, 255, 0.15);
            color: #fff;
            border-color: #8b6cf7;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(130, 80, 255, 0.4);
        }

        .filter-btn .cat-icon {
            width: 22px; /* İkonlar 18px'den 22px'e büyütüldü */
            height: 22px;
            flex-shrink: 0;
            border-radius: 4px;
            object-fit: cover;
        }

        /* =============================================
           GRİD
           ============================================= */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        /* =============================================
           KARTLAR - ARKA PLAN GÖRSELLİ
           ============================================= */
        .card {
            border-radius: 16px;
            padding: 18px 16px;
            border: 1px solid rgba(130, 80, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: fadeSlideUp 0.5s ease forwards;
            opacity: 0;
            border-left-width: 4px;
            border-left-style: solid;
            -webkit-tap-highlight-color: transparent;
            min-height: 170px;
            background-size: cover;
            background-position: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 11, 30, 0.30);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 0;
            transition: 0.4s ease;
        }

        .card:hover::before {
            background: rgba(10, 11, 30, 0.15);
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }

        .card .badge,
        .card h3,
        .card .desc,
        .card .meta {
            position: relative;
            z-index: 1;
        }

        .card::after {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 55px;
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
            line-height: 1;
        }
        .card[data-category="mm2"]::after { content: '🗡️'; }
        .card[data-category="bloxfruits"]::after { content: '🍎'; }
        .card[data-category="petsim"]::after { content: '🐾'; }
        .card[data-category="dahood"]::after { content: '🏙️'; }
        .card[data-category="bladeball"]::after { content: '⚔️'; }
        .card[data-category="brookhaven"]::after { content: '🏡'; }
        .card[data-category="other"]::after { content: '📦'; }

        .card[data-category="mm2"] {
            background-image: url('https://i.ibb.co/fYR9C82Q/Gemini-Generated-mage-wlp9gswlp9gswlp9.png');
            border-left-color: #f472b6;
        }

        .card[data-category="bloxfruits"] {
            background-image: url('https://i.ibb.co/RKxvJTs/Gemini-Generated-mage-cl63rlcl63rlcl63.png');
            border-left-color: #fb923c;
        }

        .card[data-category="petsim"] {
            background-image: url('https://i.ibb.co/CsBz9wFV/Gemini-Generated-mage-549tgp549tgp549t.png');
            border-left-color: #fbbf24;
        }

        .card[data-category="dahood"] {
            background-image: url('https://i.ibb.co/TxwXPYXh/Gemini-Generated-mage-j704gnj704gnj704.png');
            border-left-color: #34d399;
        }

        .card[data-category="bladeball"] {
            background-image: url('https://i.ibb.co/d0Bd6hcT/Gemini-Generated-mage-rva68wrva68wrva6.png');
            border-left-color: #f472b6;
        }

        .card[data-category="brookhaven"] {
            background-image: url('https://i.ibb.co/HLqdSYZH/Gemini-Generated-mage-8d82748d82748d82.png');
            border-left-color: #60a5fa;
        }

        .card[data-category="other"] {
            background-image: url('https://i.ibb.co/fVpH74rC/Gemini-Generated-mage-6s79f36s79f36s79.png');
            border-left-color: #a78bfa;
        }

        .card:hover {
            transform: translateY(-3px) scale(1.01);
            border-color: rgba(130, 80, 255, 0.25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .card .badge {
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            color: #c4b5fd;
            align-self: flex-end;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        .card .badge img {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            object-fit: cover;
        }

        .card h3 {
            font-size: 17px;
            font-weight: 700;
            margin: 10px 0 6px;
            color: #ffffff;
            letter-spacing: -0.2px;
            position: relative;
            z-index: 1;
            transition: 0.3s;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.6);
        }

        .card:hover h3 {
            color: #c4b5fd;
        }

        .card .desc {
            color: #d4c8ff;
            font-size: 13px;
            line-height: 1.6;
            flex: 1;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
        }

        .card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .card .meta .category-tag {
            background: rgba(0, 0, 0, 0.35);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #d4c8ff;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .card .meta .category-tag img {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            object-fit: cover;
        }

        .card .get-btn {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
            z-index: 2;
            box-shadow: 0 2px 15px rgba(130, 80, 255, 0.2);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .card .get-btn:active {
            transform: scale(0.95);
        }

        .card:hover .get-btn {
            background: linear-gradient(135deg, #8b6cf7, #7c3aed);
            box-shadow: 0 4px 25px rgba(130, 80, 255, 0.4);
            transform: translateY(-2px);
        }

        /* =============================================
           MODAL
           ============================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 4, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(16, 14, 45, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 480px;
            width: 100%;
            border-radius: 22px;
            padding: 24px 20px;
            border: 1px solid rgba(130, 80, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            animation: modalZoom 0.35s cubic-bezier(0.21, 1.02, 0.73, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: #6d7a9e;
            font-size: 26px;
            cursor: pointer;
            transition: 0.3s;
            padding: 4px 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .close-modal:active {
            transform: scale(0.9);
        }
        .close-modal:hover {
            color: #c4b5fd;
        }

        .modal-sub {
            color: #a5b4fc;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .task-item {
            background: rgba(10, 8, 30, 0.5);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(130, 80, 255, 0.06);
            transition: 0.3s;
        }

        .task-item:hover {
            border-color: rgba(130, 80, 255, 0.12);
        }

        .task-item .task-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .task-item .task-name {
            font-weight: 600;
            font-size: 14px;
            color: #f0ecff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-item .task-name svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .task-btn {
            background: rgba(130, 80, 255, 0.12);
            border: none;
            color: #e8edf5;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .task-btn:active {
            transform: scale(0.95);
        }
        .task-btn:hover {
            background: rgba(130, 80, 255, 0.2);
        }

        .task-btn.completed {
            background: #22c55e;
            color: #fff;
        }
        .task-btn.completed:hover {
            background: #16a34a;
        }

        .task-btn .timer {
            font-weight: 400;
            background: rgba(0, 0, 0, 0.25);
            padding: 0 8px;
            border-radius: 30px;
            font-size: 12px;
        }

        .task-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .unlock-btn {
            background: rgba(130, 80, 255, 0.08);
            border: none;
            color: #6d7a9e;
            padding: 12px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: not-allowed;
            transition: 0.3s;
            width: 100%;
            margin-top: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .unlock-btn.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 2px 20px rgba(130, 80, 255, 0.3);
        }

        .unlock-btn.active:active {
            transform: scale(0.97);
        }
        .unlock-btn.active:hover {
            box-shadow: 0 4px 30px rgba(130, 80, 255, 0.4);
        }

        .code-box {
            background: rgba(10, 8, 30, 0.9);
            border-radius: 14px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #c4b5fd;
            word-break: break-all;
            border: 1px solid rgba(130, 80, 255, 0.1);
            max-height: 100px;
            overflow-y: auto;
            display: none;
            margin-top: 12px;
        }

        .code-box.show {
            display: block;
            animation: fadeSlideUp 0.3s ease forwards;
        }

        .copy-btn {
            background: rgba(130, 80, 255, 0.1);
            border: none;
            color: #e8edf5;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
        }

        .copy-btn:active {
            transform: scale(0.97);
        }
        .copy-btn:hover {
            background: rgba(130, 80, 255, 0.2);
        }

        /* =============================================
           SCROLLBAR
           ============================================= */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 8, 30, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #4c3b7a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6d4fa8;
        }

        /* =============================================
           TABLET & BÜYÜK EKRAN
           ============================================= */
        @media (min-width: 600px) {
            body {
                padding: 20px;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 20px;
            }

            .header {
                padding: 18px 24px;
                flex-wrap: nowrap;
            }

            .header-right {
                width: auto;
                margin-top: 0;
                flex: 0 0 260px;
            }

            .search-box input {
                font-size: 15px;
            }

            .logo h1 {
                font-size: 28px;
            }

            .logo span {
                font-size: 13px;
            }

            .logo-img {
                width: 50px;
                height: 50px;
            }

            .card {
                padding: 22px 20px;
                border-left-width: 6px;
                min-height: 200px;
            }

            { id: 46, name: "Slap Battles Aura Hub", category: "other", img: "https://i.ibb.co/Zpdy6k1y/cab13a4f-2952-4880-b092-0e8bf76d64df.jpg", desc: "Auto Farm, Auto Slap, Auto Glove, Kill Aura, ESP", link: "loadstring(game:HttpGet('https://raw.githubusercontent.com/AuraScripts/SlapBattles/main/AuraHub.lua'))()" }
        ];

        // =============================================
        // DOM İŞLEMLERİ
        // =============================================
        const grid = document.getElementById('scriptGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const unlockBtn = document.getElementById('unlockBtn');
        const codeBox = document.getElementById('codeBox');
        const copyBtn = document.getElementById('copyCodeBtn');

        const taskState = {
            discord: { completed: false, timer: null },
            youtube: { completed: false, timer: null },
            tiktok: { completed: false, timer: null }
        };

        let currentScriptLink = '';
        let activeFilter = 'all';

        function renderCards(filter, query) {
            const filtered = scripts.filter(s => {
                const matchCategory = filter === 'all' || s.category === filter;
                const matchQuery = s.name.toLowerCase().includes(query.toLowerCase()) ||
                    s.desc.toLowerCase().includes(query.toLowerCase());
                return matchCategory && matchQuery;
            });

            if (filtered.length === 0) {
                grid.innerHTML =
                    `<p style="grid-column:1/-1; text-align:center; color:#a5b4fc; padding:40px 0; font-size:15px;">🔍 Sonuç bulunamadı.</p>`;
                return;
            }

            grid.innerHTML = filtered.map((s) => `
                    <div class="card" data-category="${s.category}">
                        <span class="badge">
                            <img src="${s.img}" alt="${s.category}" loading="lazy">
                            ${s.category.toUpperCase()}
                        </span>
                        <h3>${s.name}</h3>
                        <div class="desc">${s.desc}</div>
                        <div class="meta">
                            <span class="category-tag">
                                <img src="${s.img}" alt="${s.category}" loading="lazy">
                                #${s.category}
                            </span>
                            <button class="get-btn" data-link="${s.link}">📥 GET</button>
                        </div>
                    </div>
                `).join('');

            document.querySelectorAll('.get-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    currentScriptLink = this.dataset.link;
                    openModal();
                });
            });
        }

        function openModal() {
            resetTasks();
            codeBox.classList.remove('show');
            codeBox.textContent = '';
            copyBtn.style.display = 'none';
            unlockBtn.disabled = true;
            unlockBtn.classList.remove('active');
            unlockBtn.textContent = '🔒 Görevleri Tamamla';
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            ['discord', 'youtube', 'tiktok'].forEach(task => {
                if (taskState[task].timer) {
                    clearInterval(taskState[task].timer);
                    taskState[task].timer = null;
                }
            });
        }

        function resetTasks() {
            ['discord', 'youtube', 'tiktok'].forEach(task => {
                taskState[task].completed = false;
                const btn = document.querySelector(`.task-btn[data-task="${task}"]`);
                if (btn) {
                    btn.classList.remove('completed');
                    btn.disabled = false;
                    const names = { discord: 'Katıl', youtube: 'Abone Ol', tiktok: 'Takip Et' };
                    btn.innerHTML = names[task];
                    const timerSpan = btn.querySelector('.timer');
                    if (timerSpan) timerSpan.remove();
                }
                const taskDiv = document.getElementById(`task${task.charAt(0).toUpperCase() + task.slice(1)}`);
                if (taskDiv) taskDiv.style.borderColor = 'rgba(130, 80, 255, 0.06)';
            });
            unlockBtn.disabled = true;
            unlockBtn.classList.remove('active');
            unlockBtn.textContent = '🔒 Görevleri Tamamla';
        }

        document.querySelectorAll('.task-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const task = this.dataset.task;
                if (taskState[task].completed) return;

                const urls = {
                    discord: 'https://discord.gg/JJmEGx9mN3',
                    youtube: 'https://www.youtube.com/@mm2_ultimatehub',
                    tiktok: 'https://www.tiktok.com/@mm2_ultimatehub'
                };
                window.open(urls[task], '_blank');

                const btnEl = this;
                btnEl.disabled = true;
                let count = 40;
                const timerSpan = document.createElement('span');
                timerSpan.className = 'timer';
                timerSpan.textContent = `⏳ ${count}s`;
                btnEl.appendChild(timerSpan);

                const timerId = setInterval(() => {
                    count--;
                    timerSpan.textContent = `⏳ ${count}s`;
                    if (count <= 0) {
                        clearInterval(timerId);
                        taskState[task].completed = true;
                        btnEl.classList.add('completed');
                        btnEl.disabled = false;
                        const doneNames = { discord: '✅ Katıldın!', youtube: '✅ Abone Oldun!',
                            tiktok: '✅ Takip Ettin!' };
                        btnEl.innerHTML = doneNames[task];
                        const taskDiv = document.getElementById(`task${task.charAt(0).toUpperCase() + task.slice(1)}`);
                        if (taskDiv) taskDiv.style.borderColor = '#22c55e';
                        checkUnlock();
                    }
                }, 1000);

                taskState[task].timer = timerId;
            });
        });

        function checkUnlock() {
            if (taskState.discord.completed && taskState.youtube.completed && taskState.tiktok.completed) {
                unlockBtn.disabled = false;
                unlockBtn.classList.add('active');
                unlockBtn.textContent = '🔓 Kodu Göster';
            }
        }

        unlockBtn.addEventListener('click', function() {
            if (this.disabled) return;
            codeBox.textContent = currentScriptLink;
            codeBox.classList.add('show');
            copyBtn.style.display = 'block';
            this.textContent = '✅ Kod Hazır';
            this.disabled = true;
        });

        copyBtn.addEventListener('click', function() {
            const code = codeBox.textContent;
            if (!code) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code).then(() => {
                    this.textContent = '✅ Kopyalandı!';
                    setTimeout(() => { this.textContent = '📋 Kodu Kopyala'; }, 2000);
                }).catch(() => fallbackCopy(code, this));
            } else {
                fallbackCopy(code, this);
            }
        });

        function fallbackCopy(code, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = code;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                btn.textContent = '✅ Kopyalandı!';
                setTimeout(() => { btn.textContent = '📋 Kodu Kopyala'; }, 2000);
            } catch (err) {
                btn.textContent = '❌ Hata!';
                setTimeout(() => { btn.textContent = '📋 Kodu Kopyala'; }, 2000);
            }
            document.body.removeChild(textarea);
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activeFilter = this.dataset.category;
                renderCards(activeFilter, searchInput.value);
            });
        });

        searchInput.addEventListener('input', function() {
            renderCards(activeFilter, this.value);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        renderCards('all', '');
    </script>
